[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ObjectLedger"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "matplotlib"]
[project.scripts]
objectledger = "objectledger:main"
[tool.setuptools]
py-modules = ["objectledger"]
